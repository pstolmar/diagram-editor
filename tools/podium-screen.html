<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Results — AI Robot Challenge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05050c;font-family:'Segoe UI',system-ui,sans-serif;color:#fff}
canvas#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}

/* ── Screens ───────────────────────────────────────────── */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .6s}
.screen.active{opacity:1;pointer-events:all}

/* ── INTRO screen ──────────────────────────────────────── */
#intro .game-over{font-size:clamp(40px,8vw,96px);font-weight:900;letter-spacing:-2px;color:#fff;text-shadow:0 0 60px rgba(150,80,255,.6)}
#intro .subtitle{font-size:clamp(14px,2vw,20px);color:#555;letter-spacing:4px;text-transform:uppercase;margin-top:14px}
.flicker{animation:flicker 3s ease-in-out forwards}
@keyframes flicker{0%{opacity:0}10%{opacity:1}12%{opacity:.3}14%{opacity:1}60%{opacity:1}100%{opacity:0}}

/* ── LEADERBOARD screen ─────────────────────────────────── */
#lb-screen{background:#05050c;align-items:stretch;padding:40px 60px;overflow:hidden}
#lb-screen h2{font-size:clamp(14px,2vw,18px);font-weight:700;letter-spacing:2px;color:#444;text-transform:uppercase;text-align:center;margin-bottom:32px;flex-shrink:0}
.lb-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:900px;margin:0 auto}
.lb-item{display:flex;align-items:center;gap:16px;padding:12px 20px;border-radius:12px;background:#0d0d18;border:1px solid #1a1a2a;
  opacity:0;transform:translateX(-60px);transition:opacity .5s, transform .5s}
.lb-item.show{opacity:1;transform:translateX(0)}
.lb-rank-num{font-size:clamp(18px,2.5vw,26px);font-weight:900;width:36px;text-align:center;flex-shrink:0}
.lb-team-name{flex:1;font-size:clamp(13px,1.8vw,18px);font-weight:700}
.lb-players-tag{font-size:11px;color:#444;margin-top:2px}
.lb-bar-wrap{width:clamp(120px,25vw,300px);flex-shrink:0}
.lb-bar-bg{background:#111;border-radius:6px;height:8px;overflow:hidden}
.lb-bar-inner{height:8px;border-radius:6px;width:0;transition:width 1.2s cubic-bezier(.22,1,.36,1)}
.lb-score-num{font-size:clamp(20px,3vw,32px);font-weight:900;width:90px;text-align:right;flex-shrink:0}

/* ── PODIUM screen ──────────────────────────────────────── */
#podium-screen{background:radial-gradient(ellipse at 50% 120%, #1a0a2e 0%, #05050c 60%)}
#podium-screen .podium-title{font-size:clamp(16px,2.5vw,22px);font-weight:700;letter-spacing:3px;color:#555;text-transform:uppercase;margin-bottom:40px}
.podium-stage{display:flex;align-items:flex-end;justify-content:center;gap:0;height:clamp(280px,40vh,400px);width:100%;max-width:900px}

.p-slot{display:flex;flex-direction:column;align-items:center;width:260px;position:relative}
.p-crown{font-size:40px;margin-bottom:10px;opacity:0;transition:opacity .5s .3s}
.p-slot.revealed .p-crown{opacity:1}
.p-name{font-size:clamp(14px,1.8vw,18px);font-weight:800;text-align:center;margin-bottom:4px;opacity:0;transform:translateY(10px);transition:opacity .4s, transform .4s}
.p-slot.revealed .p-name{opacity:1;transform:translateY(0)}
.p-score{font-size:clamp(24px,4vw,44px);font-weight:900;opacity:0;transform:translateY(6px);transition:opacity .4s .1s, transform .4s .1s}
.p-slot.revealed .p-score{opacity:1;transform:translateY(0)}
.p-players{font-size:11px;color:#555;margin-bottom:14px;opacity:0;transition:opacity .4s .2s}
.p-slot.revealed .p-players{opacity:1}

.p-block{width:220px;border-radius:10px 10px 0 0;transform:scaleY(0);transform-origin:bottom;transition:transform .8s cubic-bezier(.34,1.56,.64,1);display:flex;align-items:flex-start;justify-content:center;padding-top:16px;font-size:28px;font-weight:900;color:rgba(0,0,0,.3)}
.p-slot.revealed .p-block{transform:scaleY(1)}

.p-slot.first .p-block{background:linear-gradient(180deg,#8a6000,#5a3800);border-top:3px solid #D4A017;height:clamp(180px,25vh,260px)}
.p-slot.second .p-block{background:linear-gradient(180deg,#3a3a3a,#222);border-top:3px solid #888;height:clamp(130px,18vh,190px)}
.p-slot.third .p-block{background:linear-gradient(180deg,#5a3a10,#3a2008);border-top:3px solid #a07040;height:clamp(100px,14vh,150px)}

/* ── Glows for winner ───────────────────────────────── */
.p-slot.first .p-name,.p-slot.first .p-score{text-shadow:0 0 30px currentColor}
.p-slot.first.revealed .p-block{box-shadow:0 0 60px rgba(212,160,23,.3)}

/* ── Scanlines overlay ──────────────────────────────── */
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px);pointer-events:none;z-index:998}

/* ── Restart button ─────────────────────────────────── */
#restart{position:fixed;bottom:24px;right:24px;background:#1a1a2a;border:1px solid #2a2a3a;color:#555;font-size:12px;padding:8px 16px;border-radius:8px;cursor:pointer;z-index:1000;transition:color .2s,border-color .2s}
#restart:hover{color:#fff;border-color:#555}
</style>
</head>
<body>
<canvas id="confetti"></canvas>

<!-- ── INTRO ─────────────────────────────────────────────── -->
<div class="screen active" id="intro">
  <div class="game-over flicker">RESULTS</div>
  <div class="subtitle">AI Robot Challenge · Live Game</div>
</div>

<!-- ── LEADERBOARD ───────────────────────────────────────── -->
<div class="screen" id="lb-screen">
  <h2>Final Standings — 16 Players · 8 Teams</h2>
  <div class="lb-list" id="lb-list"></div>
</div>

<!-- ── PODIUM ────────────────────────────────────────────── -->
<div class="screen" id="podium-screen">
  <div class="podium-title">Podium</div>
  <div class="podium-stage">

    <!-- 2nd: Prompt Engineers -->
    <div class="p-slot second" id="p2">
      <div class="p-crown">🥈</div>
      <div class="p-name" style="color:#4488ee">Prompt Engineers</div>
      <div class="p-score" style="color:#4488ee"><span class="counter" data-target="1000">0</span></div>
      <div class="p-players">2 players · 3 tiebreaks won</div>
      <div class="p-block">2</div>
    </div>

    <!-- 1st: LLM Dreamers (centre, tallest) -->
    <div class="p-slot first" id="p1">
      <div class="p-crown">🥇</div>
      <div class="p-name" style="color:#D4A017">LLM Dreamers</div>
      <div class="p-score" style="color:#D4A017"><span class="counter" data-target="1000">0</span></div>
      <div class="p-players">2 players · tied 1st · perfect score</div>
      <div class="p-block">1</div>
    </div>

    <!-- 3rd: Search Party -->
    <div class="p-slot third" id="p3">
      <div class="p-crown">🥉</div>
      <div class="p-name" style="color:#28c060">Search Party</div>
      <div class="p-score" style="color:#28c060"><span class="counter" data-target="900">0</span></div>
      <div class="p-players">2 players</div>
      <div class="p-block">3</div>
    </div>

  </div>
</div>

<button id="restart" onclick="startShow()">↺ Replay</button>

<script>
// ── Data ────────────────────────────────────────────────────────────────
const RESULTS = [
  { rank:1, name:'LLM Dreamers',            score:1000, players:2, color:'#2abaee', note:'Perfect · 2 tiebreaks', barPct:100 },
  { rank:1, name:'Prompt Engineers',         score:1000, players:2, color:'#4488ee', note:'Perfect · 3 tiebreaks', barPct:100 },
  { rank:3, name:'Search Party',             score:900,  players:2, color:'#28c060', note:'Utility unanimous',     barPct:90  },
  { rank:4, name:'Token Titans',             score:825,  players:2, color:'#D4A017', note:'Heavy lift cost them',  barPct:82.5},
  { rank:5, name:'Agents of Chaos',          score:650,  players:3, color:'#ee4444', note:'Most players, mid rank',barPct:65  },
  { rank:6, name:'Context Window Warriors',  score:550,  players:1, color:'#8a4aee', note:'Solo player',           barPct:55  },
  { rank:7, name:'Mixture of Experts',       score:375,  players:3, color:'#e07820', note:'Suction cup hurt them', barPct:37.5},
  { rank:7, name:'The Verifiers',            score:375,  players:1, color:'#aaaaaa', note:'Solo · at least verifying', barPct:37.5},
];
const RANK_COLORS = { 1:'#D4A017', 2:'#888', 3:'#a07040' };

// ── Build leaderboard HTML ───────────────────────────────────────────────
const list = document.getElementById('lb-list');
// Build in REVERSE order so we reveal 8→1 (builds suspense)
[...RESULTS].reverse().forEach((r, i) => {
  const el = document.createElement('div');
  el.className = 'lb-item';
  el.style.transitionDelay = `${i * 0.12}s`;
  el.innerHTML = `
    <div class="lb-rank-num" style="color:${RANK_COLORS[r.rank]||'#555'}">${r.rank}</div>
    <div style="flex:1">
      <div class="lb-team-name" style="color:${r.color}">${r.name}</div>
      <div class="lb-players-tag">${r.players} player${r.players!==1?'s':''} · ${r.note}</div>
    </div>
    <div class="lb-bar-wrap">
      <div class="lb-bar-bg">
        <div class="lb-bar-inner" data-pct="${r.barPct}" style="background:${r.color}"></div>
      </div>
    </div>
    <div class="lb-score-num" style="color:${r.color}">${r.score}<span style="font-size:11px;color:#333"> pts</span></div>
  `;
  list.appendChild(el);
});

// ── Screen management ────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── Counter animation ────────────────────────────────────────────────────
function animateCounter(el, target, duration) {
  const start = performance.now();
  function tick(now) {
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    const ease = 1 - Math.pow(1 - progress, 3);
    el.textContent = Math.round(ease * target);
    if (progress < 1) requestAnimationFrame(tick);
    else el.textContent = target;
  }
  requestAnimationFrame(tick);
}

// ── Confetti ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
let particles = [];
let confettiActive = false;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const COLORS_CONF = ['#D4A017','#2abaee','#4488ee','#28c060','#ee4444','#9b59b6','#fff'];

function spawnConfetti(n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height * -.5,
      w: 6 + Math.random() * 8,
      h: 3 + Math.random() * 5,
      color: COLORS_CONF[Math.floor(Math.random() * COLORS_CONF.length)],
      vx: (Math.random() - .5) * 3,
      vy: 2 + Math.random() * 4,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - .5) * .2,
      alpha: 1,
    });
  }
}

function tickConfetti() {
  if (!confettiActive) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter(p => p.alpha > 0.01);
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += .06;
    p.rot += p.vrot;
    if (p.y > canvas.height) p.alpha -= .05;
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctx.restore();
  });
  requestAnimationFrame(tickConfetti);
}

function startConfetti() {
  confettiActive = true;
  spawnConfetti(200);
  let spawns = 0;
  const si = setInterval(() => {
    spawnConfetti(40);
    if (++spawns > 8) clearInterval(si);
  }, 400);
  tickConfetti();
  setTimeout(() => { confettiActive = false; }, 6000);
}

// ── Main show sequence ───────────────────────────────────────────────────
function startShow() {
  // reset
  confettiActive = false;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = [];
  document.querySelectorAll('.lb-item').forEach(el => el.classList.remove('show'));
  document.querySelectorAll('.lb-bar-inner').forEach(el => el.style.width = '0');
  document.querySelectorAll('.p-slot').forEach(el => el.classList.remove('revealed'));
  document.querySelectorAll('.counter').forEach(el => el.textContent = '0');

  // Step 1: intro (2.8s)
  showScreen('intro');

  // Step 2: leaderboard reveal (at 2.8s)
  setTimeout(() => {
    showScreen('lb-screen');
    const items = document.querySelectorAll('.lb-item');
    // items are reversed (8→1). Reveal them spaced 150ms each
    items.forEach((el, i) => {
      setTimeout(() => {
        el.classList.add('show');
        // animate bar once visible
        const bar = el.querySelector('.lb-bar-inner');
        setTimeout(() => { bar.style.width = bar.dataset.pct + '%'; }, 100);
      }, i * 150);
    });
  }, 2800);

  // Step 3: podium (at 2.8 + 8*150ms + 1.5s = ~6.5s)
  setTimeout(() => {
    showScreen('podium-screen');

    // 3rd place rises (0.3s delay)
    setTimeout(() => {
      document.getElementById('p3').classList.add('revealed');
    }, 400);

    // 2nd place (1.1s)
    setTimeout(() => {
      document.getElementById('p2').classList.add('revealed');
    }, 1200);

    // 1st place + confetti + counters (2.2s)
    setTimeout(() => {
      document.getElementById('p1').classList.add('revealed');
      startConfetti();
      // Animate all counters once podium reveals
      document.querySelectorAll('.counter').forEach(el => {
        animateCounter(el, parseInt(el.dataset.target), 1400);
      });
    }, 2200);

  }, 6500);
}

// Auto-start
window.addEventListener('load', startShow);
</script>
</body>
</html>
