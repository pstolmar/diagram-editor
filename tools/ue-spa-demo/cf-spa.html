<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="urn:adobe:aue:system:aem" content="aem:https://author-p138879-e1741192.adobeaemcloud.com"/>
  <title>CF Live SPA</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://universal-editor-service.adobe.io/cors.js" async></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; padding: 40px 20px; }
    .shell { max-width: 860px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .status {
      font-size: 0.75rem; color: #666; margin-bottom: 24px;
      display: flex; align-items: center; gap: 12px;
    }
    .pulse {
      width: 8px; height: 8px; border-radius: 50%; background: #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }
    button {
      font: inherit; font-size: 0.75rem; padding: 3px 10px;
      border: 1px solid #ccc; border-radius: 4px; background: #fff;
      cursor: pointer;
    }
    button:hover { background: #eee; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
    .card {
      background: #fff; border-radius: 10px;
      padding: 24px; border: 1px solid #e5e5e5;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .card-eyebrow {
      font-size: 0.65rem; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: #0070f3; margin-bottom: 8px;
    }
    .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; }
    .card-body { font-size: 0.9rem; color: #444; line-height: 1.55; }
    .loading { color: #aaa; font-size: 0.85rem; text-align: center; padding: 40px; }
    .err { color: #e53e3e; font-size: 0.8rem; padding: 12px; background: #fff5f5; border-radius: 6px; }
  </style>
</head>
<body>
<div id="root"></div>
<script>
const { useState, useEffect, useCallback, createElement: h } = React;
const PUBLISH = 'https://publish-p138879-e1741192.adobeaemcloud.com';
const CF_IDS  = ['feature-headless', 'feature-personalization', 'feature-experimentation'];
const POLL_MS = 10000;

function cfRes(id) {
  return 'urn:aem:/content/dam/ue-demo/fragments/' + id + '/jcr:content/data/master';
}

function fetchCFs() {
  return fetch(
    PUBLISH + '/graphql/execute.json/global/featurelist?_t=' + Date.now(),
    { headers: { Accept: 'application/json' }, cache: 'no-store' }
  )
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => {
      const map = {};
      (d?.data?.homeHeroList?.items || []).forEach(item => {
        map[item._path.split('/').pop()] = item;
      });
      return map;
    });
}

function Card({ id, cf }) {
  const res = cfRes(id);
  const eyebrow = cf?.eyebrow  || id;
  const title   = cf?.title    || id;
  const body    = cf?.description?.plaintext || cf?.description?.html || '';

  return h('div', {
    className: 'card',
    'data-aue-resource': res,
    'data-aue-type':     'component',
    'data-aue-label':    title,
    'data-aue-model':    'hero',
  },
    h('p', {
      className: 'card-eyebrow',
      'data-aue-resource': res,
      'data-aue-prop':     'eyebrow',
      'data-aue-type':     'text',
      'data-aue-label':    'Eyebrow',
    }, eyebrow),
    h('h2', {
      className: 'card-title',
      'data-aue-resource': res,
      'data-aue-prop':     'title',
      'data-aue-type':     'text',
      'data-aue-label':    'Title',
    }, title),
    h('p', {
      className: 'card-body',
      'data-aue-resource': res,
      'data-aue-prop':     'description',
      'data-aue-type':     'richtext',
      'data-aue-label':    'Description',
    }, body)
  );
}

function App() {
  const [cfs,     setCfs]     = useState(null);
  const [err,     setErr]     = useState(null);
  const [fetched, setFetched] = useState('—');

  const load = useCallback(() => {
    fetchCFs()
      .then(map => { setCfs(map); setErr(null); setFetched(new Date().toLocaleTimeString()); })
      .catch(e  => setErr(e.message));
  }, []);

  useEffect(() => {
    load();
    const t = setInterval(load, POLL_MS);
    return () => clearInterval(t);
  }, [load]);

  return h('div', { className: 'shell' },
    h('h1', null, 'Content Fragments — Live SPA'),
    h('div', { className: 'status' },
      h('div', { className: 'pulse' }),
      'Polling AEM every ' + (POLL_MS / 1000) + 's · last: ' + fetched,
      h('button', { onClick: load }, 'Refresh now')
    ),
    err  ? h('p', { className: 'err' }, 'Fetch error: ' + err) : null,
    cfs === null
      ? h('p', { className: 'loading' }, 'Loading from AEM…')
      : h('div', { className: 'grid' },
          CF_IDS.map(id => h(Card, { key: id, id, cf: cfs[id] }))
        )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App, null));
</script>
</body>
</html>
