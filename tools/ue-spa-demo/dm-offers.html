<script>
'use strict';
const { useState, useEffect, useRef, useCallback, createElement: h } = React;

/* ── AEM publish ─────────────────────────────────────────────────── */
const PUBLISH = 'https://publish-p138879-e1741192.adobeaemcloud.com';

/* ── Month utilities ─────────────────────────────────────────────── */
const MONTH_NAMES = {
  'en-US': ['January','February','March','April','May','June','July','August','September','October','November','December'],
  'de-DE': ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'],
  'es-MX': ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],
  'es-ES': ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'],
};

function offerMonthForLocale(locale) {
  const now = new Date();
  const idx = (now.getMonth() + (now.getDate() > 20 ? 2 : 1)) % 12;
  return MONTH_NAMES[locale][idx];
}

const OFFER_MONTH = offerMonthForLocale('en-US');
const ENDDATE     = `${OFFER_MONTH} 15, 2026`;

/* ── Locale data (DiscountOffer panel) ───────────────────────────── */
const LOCALES = {
  'en-US': (m) => ({
    flag: '🇺🇸', label: 'English (US)',
    category: 'Couch Co-op', currency: 'USD', symbol: '$',
    enddate: `${m} 15, 2026`,
    headline: `${m} savings are here`,
  }),
  'de-DE': (m) => ({
    flag: '🇩🇪', label: 'Deutsch (DE)',
    category: 'Couch-Koop-Spiele', currency: 'EUR', symbol: '€',
    enddate: `15. ${m} 2026`,

  'es-MX': (m) => ({

    category: 'Cooperativo en sofá', currency: 'MXN', symbol: 'MX$',
    enddate: `15 de ${m} de 2026`,

  'es-ES': (m) => ({
    flag: '🇪🇸', label: 'Español (ES)',

/* ── DiscountOffer URL builder ───────────────────────────────────── */
function dmUrl({ percent, image, category, hideBackground, enddate }, width) {
  const base = 'https://s7d1.scene7.com/is/image/PeterStolmarNA001/DiscountOffer';
  const enc  = encodeURIComponent;
  return (
    `${base}?$hidebackground=${hideBackground}` +
    `&$percent=${percent}` +
    `&$image=${image}` +
    `&$category=${enc(category)}` +
    `&$enddate=${enc(enddate || ENDDATE)}` +
    `&wid=${width}&qlt=85&fmt=png-alpha`
  );
}

/* ── InternationalOffer URL builder (from CF item) ───────────────── */
const INTL_BASE = 'https://s7d1.scene7.com/is/image/PeterStolmarNA001/InternationalOffer';
function intlUrl(cfItem, width = 900) {
  const enc   = encodeURIComponent;
  const title = cfItem?.title || 'Adobe Experience';
  /* description goes into $offer — InternationalOffer has relaxed Copyfit (3 lines) */
  const desc  = cfItem?.description?.plaintext || title;
  return `${INTL_BASE}?$offer=${enc(desc)}&$price=${enc(title)}&$hideprice=0` +
    `&$hidepurplecircle=1&$hideyellowcircle=0&$hidemiddlecircle=1` +
    `&wid=${width}&qlt=85&fmt=jpeg`;
}

/* ── InternationalOffer — raw fixed URLs ─────────────────────────── */
const INTL_EN_CLEAN = INTL_BASE +
  '?$offer=Adventure%20Travel%20Deals&$price=As%20low%20as%20%24800' +
  '&$hideprice=1&$hidepurplecircle=1&$hideyellowcircle=1&$hidemiddlecircle=1' +
  '&wid=900&qlt=85&fmt=jpeg';

const INTL_EN_FULL = INTL_BASE +
  '?$offer=Adventure%20Travel%20Deals&$price=As%20low%20as%20%24800' +
  '&$hideprice=0&$hidepurplecircle=1&$hideyellowcircle=1&$hidemiddlecircle=1' +
  '&wid=900&qlt=85&fmt=jpeg';

const INTL_DE = INTL_BASE +
  '?$offer=Resort-Urlaube%20Verpflegung%20und%20Getr%C3%A4nke%20inklusive' +

  '&hidebluecircle=1&hidepurplecircle=1&hideyellowcircle=0' +

const INTL_IT = INTL_BASE +
  '?$offer=Villaggi%20turistici%20tutto%20compreso' +
  '&$price=a%20partire%20da%20un%20milione%20settecentomila%20lire' +
  '&$hideprice=0&$hidebluecircle=1&$hidepurplecircle=1&$hideyellowcircle=1' +
  '&$hideredrectangle=0&wid=900&qlt=90&fit=constrain&fmt=jpeg';

/* ── Hero slide / offer data ─────────────────────────────────────── */
const SLIDES = [
  {
    id: 'games', percent: 75,
    image: 'PeterStolmarNA001/approved-phone-app',
    category: 'Digital Games', hideBackground: 0,
    gradient: 'linear-gradient(135deg, #1a6fd4 0%, #0a3d8f 100%)',
    accentColor: '#1a6fd4', label: 'Digital Games',
    subtext: 'Score massive deals on the hottest game titles this month.',

    id: 'travel', percent: 40,
    image: 'PeterStolmarNA001/AdobeStock_177645726-3:Large',
    category: 'Travel Packages', hideBackground: 1,
    gradient: 'linear-gradient(135deg, #0d9488 0%, #065f46 100%)',
    accentColor: '#0d9488', label: 'Travel Packages',
    subtext: 'Explore world-class destinations at unbeatable prices.',

const COUCH_OFFER = {
  percent: 50, image: 'PeterStolmarNA001/approved-phone-app',
  category: 'Couch Co-op', enddate: `${OFFER_MONTH} 9, 2026`,
};
const GAMES_OFFER = {
  percent: 75, image: 'PeterStolmarNA001/approved-phone-app',
  category: 'Digital Games', enddate: `${OFFER_MONTH} 15, 2026`,
};

/* ── CF fetch ────────────────────────────────────────────────────── */
function fetchCFs() {
  return fetch(
    PUBLISH + '/graphql/execute.json/global/featurelist?_t=' + Date.now(),
    { headers: { Accept: 'application/json' }, cache: 'no-store' }
  ).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
   .then(d => {
     const map = {};
     (d?.data?.homeHeroList?.items || []).forEach(i => {
       map[i._path.split('/').pop()] = i;
     });
     return map;
   });
}

/* ── NavBar ──────────────────────────────────────────────────────── */
function NavBar() {

    h('div', { className: 'navbar-badge' }, 'Powered by Adobe Dynamic Media'),

/* ── Hero components ─────────────────────────────────────────────── */
function HeroSlide({ slide, isActive }) {
  return h('div', {
    className: 'hero-slide' + (isActive ? ' active' : ''),
    style: { background: slide.gradient },
  },
    h('div', { className: 'slide-left' },
      h('p', { className: 'eyebrow' }, slide.label),
      h('div', { className: 'ribbon-wrap' },
        h('div', { className: 'ribbon' }, h('span', null, 'Save Up To')),
      ),
      h('div', { className: 'percent-num' }, `${slide.percent}%`),
      h('p', { className: 'slide-tagline' }, `${OFFER_MONTH} savings are here`),
      h('p', { className: 'slide-subtext' }, slide.subtext),
      h('button', { className: 'cta-btn' }, 'Shop now →'),
    ),
    h('div', { className: 'slide-right' },
      h('img', {
        src: dmUrl(slide, 900), alt: `${slide.category} offer`,
        loading: isActive ? 'eager' : 'lazy',
      }),
    ),
  );
}

function HeroCarousel({ current, onHoverChange }) {
  return h('div', {
    className: 'hero-carousel',
    onMouseEnter: () => onHoverChange(true),
    onMouseLeave: () => onHoverChange(false),
  }, ...SLIDES.map((s, i) => h(HeroSlide, { key: s.id, slide: s, isActive: i === current })));
}

function SlideIndicators({ current, onChange }) {
  return h('div', { className: 'indicators' },
    SLIDES.map((s, i) => h('button', {
      key: s.id, className: 'dot' + (i === current ? ' active' : ''),
      onClick: () => onChange(i), 'aria-label': `Slide ${i + 1}`,
    }))
  );
}

function ThumbnailRow({ current, onChange }) {
  return h('div', { className: 'thumb-row' },
    SLIDES.map((s, i) => {
      const active = i === current;
      return h('div', {
        key: s.id, className: 'thumb-card',
        style: {
          background: s.gradient,
          borderColor: active ? s.accentColor : 'transparent',
          boxShadow: active
            ? `0 0 0 1px ${s.accentColor}40, 0 8px 24px rgba(0,0,0,.4)`
            : '0 4px 16px rgba(0,0,0,.3)',
        },
        onClick: () => onChange(i),
      },
        h('img', { src: dmUrl(s, 320), alt: s.label, loading: 'lazy' }),
        h('div', { className: 'thumb-label' }, s.label),
      );
    })
  );
}

/* ── Sweep card ─────────────────────────────────────────────────── */
/* Accepts either offer objects (urlA/urlB auto-built) or raw string URLs */
function SweepCard({ offerA, offerB, urlA: rawA, urlB: rawB, badge = 'Variant A', color = '#1a6fd4', hint = '← sweep to compare →' }) {
  const cardRef = useRef(null);
  const [pct, setPct]           = useState(50);
  const [hovering, setHovering] = useState(false);

  const onMouseMove = useCallback((e) => {
    if (!cardRef.current) return;
    const rect = cardRef.current.getBoundingClientRect();
    setPct(Math.round(Math.max(2, Math.min(98, (e.clientX - rect.left) / rect.width * 100))));
  }, []);

  const urlA = rawA || dmUrl({ ...offerA, hideBackground: 0 }, 900);
  const urlB = rawB || dmUrl({ ...offerB, hideBackground: 0 }, 900);

  return h('div', {
    ref: cardRef, className: 'sweep-card',
    onMouseMove, onMouseEnter: () => setHovering(true),
    onMouseLeave: () => { setHovering(false); setPct(50); },
  },
    h('img', { className: 'dm-img', src: urlA, alt: 'A', style: { zIndex: 1 } }),
    h('img', {
      className: 'dm-img', src: urlB, alt: 'B',
      style: {
        zIndex: 2,
        clipPath: `inset(0 ${100 - pct}% 0 0)`,
        transition: hovering ? 'none' : 'clip-path .45s ease',
      },
    }),
    hovering && h('div', {
      className: 'sweep-divider', style: { left: `${pct}%`, zIndex: 3 },
    }, h('div', { className: 'sweep-handle' }, '↔')),
    h('div', { className: 'sweep-badge', style: { background: color, zIndex: 10 } }, badge),
    h('div', { className: 'sweep-variant-label', style: { zIndex: 10 } }, 'sweep to compare'),
    h('div', { className: 'sweep-hint', style: { opacity: hovering ? 0 : 1, zIndex: 10 } }, hint),
  );
}

/* ── Hover-reveal card ───────────────────────────────────────────── */
/* Accepts either an offer object or raw clean/offer URLs */
function HoverRevealCard({ offer, urlClean: rawClean, urlOffer: rawOffer, badge = 'Variant B', topLabel, bottomLabel }) {
  const [hovered, setHovered] = useState(false);
  const cleanUrl = rawClean || (offer && dmUrl({ ...offer, hideBackground: 1 }, 900));
  const offerUrl = rawOffer || (offer && dmUrl({ ...offer, hideBackground: 0 }, 900));
  const topText  = topLabel  || offer?.category || '';
  const botText  = bottomLabel || (offer ? `${offer.percent}% off · ends ${offer.enddate}` : '');

  return h('div', {
    className: 'reveal-card',
    onMouseEnter: () => setHovered(true),
    onMouseLeave: () => setHovered(false),
  },
    h('img', { src: cleanUrl, alt: 'Clean', style: { opacity: hovered ? 0 : 1 } }),
    h('img', { src: offerUrl, alt: 'Offer', style: { opacity: hovered ? 1 : 0 } }),
    h('div', { className: 'reveal-badge' }, badge),
    h('div', { className: 'reveal-variant-label' }, 'hover to reveal'),
    topText && h('div', {
      className: 'reveal-top-text', style: { opacity: hovered ? 0 : 1 },
    }, topText),
    h('div', {
      className: 'reveal-bottom-text',
      style: { opacity: hovered ? 1 : 0, transform: hovered ? 'translateY(0)' : 'translateY(10px)' },
    },
      botText && h('span', { className: 'big-pct' }, botText.split(' ')[0]),
      botText && (' ' + botText.split(' ').slice(1).join(' ')),
    ),
    h('div', { className: 'reveal-hint', style: { opacity: hovered ? 0 : 1 } },
      'hover to reveal offer →'),
  );
}

/* ── A/B section — two rows ─────────────────────────────────────── */
function ABSection() {
  return h('section', { className: 'ab-section' },
    h('h2', { className: 'ab-heading' }, 'A/B — Dynamic Media interaction variants'),
    h('p', { className: 'ab-sub' },
      'Two interaction patterns, two templates. ' +
      'Sweep cards wipe between two full DM renders. Hover cards fade from clean image → offer overlay.',
    ),

    h('p', { className: 'ab-row-label' }, 'Row 1 — DiscountOffer · 75% Digital Games vs 50% Couch Co-op'),
    h('div', { className: 'ab-cards' },
      h(SweepCard, { offerA: GAMES_OFFER, offerB: COUCH_OFFER, badge: 'Variant A', color: '#1a6fd4', hint: '← sweep to compare offers →' }),
      h(HoverRevealCard, { offer: COUCH_OFFER, badge: 'Variant B' }),
    ),

    h('p', { className: 'ab-row-label', style: { marginTop: '2rem' } },
      'Row 2 — InternationalOffer · DE vs IT sweep · EN → IT hover (font-size drama)'),
    h('div', { className: 'ab-cards', style: { justifyContent: 'center' } },
      /* Variant C — shrunk so it doesn't dominate; sweep DE ↔ IT Copyfit */
      h('div', { style: { flex: '0 0 420px', maxWidth: '420px' } },
        h(SweepCard, {
          urlA: INTL_DE, urlB: INTL_IT,
          badge: 'Variant C', color: '#0d9488',
          hint: '← DE / IT — watch Copyfit handle the Lira price →',
        }),
      ),
      /* Variant D — English default, hover shows Italian (dramatic Copyfit shrink) */
      h(HoverRevealCard, {
        urlClean: INTL_EN_FULL, urlOffer: INTL_IT,
        badge: 'Variant D',
        topLabel: 'Adventure Travel Deals',
        bottomLabel: '',
      }),
    ),
  );
}

/* ── Locale + Copyfit section ────────────────────────────────────── */
function LocaleSection() {
  const [locale, setLocale] = useState('en-US');
  const m    = offerMonthForLocale(locale);
  const data = LOCALES[locale](m);

  const imgUrl = dmUrl({
    percent: 50, image: 'PeterStolmarNA001/approved-phone-app',
    category: data.category, hideBackground: 0, enddate: data.enddate,
  }, 900);

  return h('section', { className: 'locale-section' },
    h('h2', { className: 'ab-heading' }, '🌐 Localization + DM Copyfit'),
    h('p', { className: 'ab-sub' },
      'Switch locale — $category and $enddate update live. ' +
      'Copyfit rules in the DiscountOffer template automatically resize text so longer strings never overflow.',
    ),
    h('div', { className: 'locale-flags' },
      Object.entries(LOCALES).map(([id, fn]) => {
        const d = fn(offerMonthForLocale(id));
        return h('button', {
          key: id,
          className: 'locale-flag-btn' + (locale === id ? ' active' : ''),
          onClick: () => setLocale(id),
        },
          h('span', { className: 'flag' }, d.flag),
          h('span', null, d.label),
        );
      }),
    ),
    h('div', { className: 'locale-layout' },
      h('div', { className: 'locale-preview' },
        h('img', { key: imgUrl, src: imgUrl, alt: `${locale} offer` }),
      ),
      h('div', { className: 'locale-params' },
        h('p', { className: 'params-heading' }, 'Params sent to Dynamic Media:'),
        h('div', { className: 'param-row' },
          h('span', { className: 'param-key' }, '$percent'), h('span', { className: 'param-val' }, '50'),
        ),
        h('div', { className: 'param-row' },
          h('span', { className: 'param-key' }, '$category'), h('span', { className: 'param-val' }, `"${data.category}"`),
        ),
        h('div', { className: 'param-row' },
          h('span', { className: 'param-key' }, '$enddate'), h('span', { className: 'param-val' }, `"${data.enddate}"`),
        ),
        h('div', { className: 'param-row' },
          h('span', { className: 'param-key' }, 'Currency'), h('span', { className: 'param-val' }, `${data.currency} (${data.symbol})`),
        ),
        h('div', { className: 'param-row' },
          h('span', { className: 'param-key' }, 'Headline'), h('span', { className: 'param-val' }, `"${data.headline}"`),
        ),
        h('p', { className: 'copyfit-note' },
          'Copyfit automatically shrinks text that would overflow — no manual size adjustment needed for longer language strings.',
        ),
      ),
    ),
  );
}

/* ── CF × DM fade cards ─────────────────────────────────────────── */
const CF_IDS = ['feature-headless', 'feature-personalization', 'feature-experimentation'];

function FadeCard({ cfItem, templateLabel, bgUrl, delay }) {
  const cardRef = useRef(null);
  const [visible, setVisible] = useState(false);

  useEffect(() => {
    const el = cardRef.current;
    if (!el) return;
    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) { setTimeout(() => setVisible(true), delay || 0); obs.disconnect(); }
    }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
    obs.observe(el);
    return () => obs.disconnect();
  }, [delay]);

  const loading = !cfItem;

  return h('div', { ref: cardRef, className: 'fade-card' + (visible ? ' visible' : '') },
    loading
      ? h('div', { className: 'cf-loading-shimmer', style: { height: '260px' } })
      : h('img', { src: bgUrl, alt: cfItem.title, loading: 'lazy' }),
    h('div', { className: 'fade-card-label' }, templateLabel),
  );
}

function CFDMSection() {
  const [cfs, setCfs] = useState({});
  const [err, setErr] = useState(null);

  useEffect(() => {
    fetchCFs().then(setCfs).catch(e => setErr(e.message));
  }, []);

  /* feature-experimentation title/desc maps well to both offer contexts */
  const cf2 = cfs['feature-experimentation'];

  return h('section', { className: 'cfdm-section' },
    h('h2', { className: 'ab-heading' }, 'Content Fragments × Dynamic Media'),
    h('p', { className: 'ab-sub' },
      'CF description and title flow directly into DM template params at request time — no image editing. ' +
      'Cards fade in on scroll. ' + (err ? `(CF fetch error: ${err})` : 'Live from AEM publish.'),
    ),

    /* Three fade cards — one per CF, description → $offer on InternationalOffer */
    h('div', { className: 'cfdm-grid' },
      CF_IDS.map((id, i) => h(FadeCard, {
        key: id,
        cfItem: cfs[id],
        templateLabel: `InternationalOffer · ${id.replace('feature-', '')} CF`,
        bgUrl: intlUrl(cfs[id]),
        delay: i * 160,
      })),
    ),

    /* Same CF, two different templates side-by-side */
    h('p', { className: 'two-templates-heading' },
      'Same content fragment — two different Dynamic Media templates:',
    ),
    h('div', { className: 'two-templates-row' },
      h('div', { className: 'template-card' },
        cf2
          ? h('img', {
              src: dmUrl({ ...COUCH_OFFER, category: cf2.title, hideBackground: 0 }, 900),
              alt: 'DiscountOffer + CF', loading: 'lazy',
            })
          : h('div', { className: 'cf-loading-shimmer', style: { height: '240px' } }),
        h('div', { className: 'template-card-label' }, 'DiscountOffer — CF title → $category'),
      ),
      h('div', { className: 'template-card' },
        cf2
          ? h('img', { src: intlUrl(cf2, 900), alt: 'InternationalOffer + CF', loading: 'lazy' })
          : h('div', { className: 'cf-loading-shimmer', style: { height: '240px' } }),
        h('div', { className: 'template-card-label' },
          'InternationalOffer — CF description → $offer (3-line Copyfit) · title → $price'),
      ),
    ),
  );
}

/* ── Footer ──────────────────────────────────────────────────────── */
function Footer() {
  return h('footer', { className: 'footer' },
    'Dynamic Media template params computed at request time — no image editing required.',
  );
}

/* ── App ─────────────────────────────────────────────────────────── */
function App() {
  const [current, setCurrent] = useState(0);
  const [paused,  setPaused]  = useState(false);

  useEffect(() => {
    if (paused) return undefined;
    const id = setInterval(() => setCurrent(p => (p + 1) % SLIDES.length), 5000);
    return () => clearInterval(id);
  }, [paused]);

  return h('div', null,
    h(NavBar),
    h(HeroCarousel, { current, onHoverChange: setPaused }),
    h(SlideIndicators, { current, onChange: setCurrent }),
    h(ThumbnailRow,    { current, onChange: setCurrent }),
    h(ABSection),
    h(LocaleSection),
    h(CFDMSection),
    h(Footer),
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
