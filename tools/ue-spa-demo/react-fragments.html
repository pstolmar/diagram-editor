  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ps-black:  #000;
      --ps-dark:   #0a0a0a;
      --ps-card:   #1a1a2e;
      --ps-blue:   #003791;
      --ps-blue2:  #00439c;
      --ps-cyan:   #00d4ff;
      --ps-red:    #e31837;
      --ps-white:  #fff;
      --ps-muted:  rgba(255,255,255,.65);
      --ps-border: rgba(255,255,255,.08);
      --eds-green: #22d3a5;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--ps-black); color: var(--ps-white);
      overflow-x: hidden;
    }
    img { display: block; }
    button { cursor: pointer; }
    a { text-decoration: none; color: inherit; }

    .ps-loading {
      display: flex; align-items: center; justify-content: center;
      min-height: 200px; font-size: .9rem; color: var(--ps-muted); gap: .75rem;
    }
    .ps-loading::before {
      content: ''; width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid var(--ps-blue2); border-top-color: var(--ps-cyan);
      animation: spin .8s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── NavBar ──────────────────────────────────────────────────────── */
    .ps-nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem; height: 56px;
      background: rgba(0,0,0,.96); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--ps-border);
    }
    .ps-nav-left  { display: flex; align-items: center; gap: 2.5rem; }
    .ps-wordmark  { font-size: 1.0625rem; font-weight: 800; letter-spacing: -.01em; }
    .ps-nav-links { display: flex; gap: 1.75rem; }
    .ps-nav-links a { font-size: .875rem; font-weight: 500; color: var(--ps-muted); transition: color .15s; }
    .ps-nav-links a:hover { color: var(--ps-white); }
    .ps-nav-right { display: flex; align-items: center; gap: .625rem; }
    .ps-nav-signin {
      background: var(--ps-blue); color: var(--ps-white); border: none; border-radius: 4px;
      padding: .5rem 1.375rem; font-family: inherit; font-size: .875rem; font-weight: 700;
      transition: background .15s;
    }
    .ps-nav-signin:hover { background: var(--ps-blue2); }
    .btn-ue {
      display: inline-flex; align-items: center; gap: .35rem;
      background: #c084fc; color: #fff; border: none; border-radius: 4px;
      padding: .45rem 1rem; font-family: inherit; font-size: .8rem; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    .btn-ue:hover { background: #a855f7; }
    .btn-da {
      display: inline-flex; align-items: center; gap: .35rem;
      background: var(--eds-green); color: #000; border: none; border-radius: 4px;
      padding: .45rem 1rem; font-family: inherit; font-size: .8rem; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    .btn-da:hover { background: #16b992; }

    .arch-section {
      background: #050510; padding: 3rem 2rem; border-bottom: 1px solid var(--ps-border);
    }
    .arch-inner { max-width: 1100px; margin: 0 auto; }
    .arch-headline {
      font-size: .7rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
      color: var(--ps-muted); margin-bottom: .5rem;
    }
    .arch-title { font-size: 1.375rem; font-weight: 900; margin-bottom: .375rem; }
    .arch-sub   { font-size: .9rem; color: var(--ps-muted); margin-bottom: 2rem; max-width: 680px; line-height: 1.6; }

    .arch-card.aem { background: rgba(0,55,145,.06);   border-color: rgba(0,212,255,.2);   }
    .arch-card-label {
      font-size: .65rem; font-weight: 800; letter-spacing: .15em; text-transform: uppercase;
      margin-bottom: .75rem;

    .arch-card.eds .arch-card-label { color: var(--eds-green); }
    .arch-card.aem .arch-card-label { color: var(--ps-cyan); }
    .arch-card-name { font-size: 1rem; font-weight: 800; margin-bottom: .625rem; }

      display: flex; gap: .5rem;
    }
    .arch-rows li::before { content: '→'; flex-shrink: 0; }
    .arch-card-edit { margin-top: 1.25rem; }

    /* ── Source ribbon ───────────────────────────────────────────────── */
    .src-ribbon {
      display: flex; align-items: center; gap: .625rem;
      padding: .5rem 2rem;
      font-size: .65rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;

    .src-ribbon.aem-ribbon {
      background: rgba(0,212,255,.06); border-bottom: 1px solid rgba(0,212,255,.15);
      color: var(--ps-cyan);
    }
    .src-ribbon-dot {
      width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;

    .src-ribbon.eds-ribbon .src-ribbon-dot { background: var(--eds-green); box-shadow: 0 0 6px var(--eds-green); }

    /* ── EDS Fragment Hero — styling the .pfh-block from the fragment ── */
    .frag-hero-section { background: var(--ps-dark); }

    /* Wrapper provides positioning context for the React countdown overlay */
    .frag-hero-wrapper { position: relative; }

    /* The injected fragment's hero block */
    .pfh-block {
      position: relative; width: 100%; height: 560px; min-height: 520px;
      overflow: hidden; background: #060b1a;
    }
    /* Images row — absolutely fills the block */
    .pfh-block > div:first-child {
      position: absolute; inset: 0;
    }
    .pfh-bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: right center; z-index: 0;
    }
    .pfh-left {
      position: absolute; bottom: 0; left: 46%;
      height: 96%; width: auto; object-fit: contain; z-index: 2;
      filter: drop-shadow(-20px 0 48px rgba(0,0,0,.85));
    }
    .pfh-right {
      position: absolute; top: 0; right: 0;
      height: 100%; width: auto; object-fit: contain; z-index: 1;
    }
    /* Content row — solid black left panel */
    .pfh-block > div:last-child {
      position: absolute; top: 0; bottom: 0; left: 0; width: 50%;
      padding: 3.5rem 3rem;
      display: flex; flex-direction: column; justify-content: center; z-index: 4;
      background: linear-gradient(90deg, #000 0%, #000 88%, transparent 100%);

    .pfh-block > div:last-child > div {
      display: flex; flex-direction: column;
    }
    .pfh-eyebrow {
      display: inline-flex; align-items: center; gap: .5rem;
      font-size: .7rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
      color: var(--ps-cyan); margin-bottom: 1rem;
    }
    .pfh-eyebrow::before { content: ''; width: 20px; height: 2px; background: var(--ps-cyan); }
    .pfh-h1 {
      font-size: clamp(2rem,4vw,3.75rem); font-weight: 900; line-height: 1.08;
      letter-spacing: -.02em; margin-bottom: 1rem;
      text-shadow: 0 2px 16px rgba(0,0,0,.6);
    }
    .pfh-desc {
      font-size: 1rem; line-height: 1.6; color: var(--ps-muted);
      max-width: 380px;
    }

    /* React-injected countdown + CTA layer — sits on top of the fragment */
    .frag-inject-layer {
      position: absolute;
      bottom: 3.5rem; left: 3rem;
      display: flex; flex-direction: column; gap: 1.75rem;
      z-index: 20;
    }
    /* Countdown widget (reuses countdown block styles from offers) */
    .countdown { display: flex; gap: .75rem; align-items: flex-end; }
    .countdown-block {
      display: flex; flex-direction: column; align-items: center;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
      border-radius: 6px; padding: .5rem .875rem; min-width: 52px;
    }
    .countdown-num {
      font-size: 1.625rem; font-weight: 900; line-height: 1;
      font-variant-numeric: tabular-nums; color: var(--ps-cyan);
    }
    .countdown-label { font-size: .6rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ps-muted); margin-top: .25rem; }
    /* Inject-layer label */
    .frag-inject-label {
      font-size: .65rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
      color: var(--eds-green); margin-bottom: -.75rem;
    }
    /* CTA button from React */
    .pfh-cta {
      display: inline-block; align-self: flex-start;
      background: var(--ps-blue); color: var(--ps-white); border: none; border-radius: 4px;
      padding: .9rem 2.25rem; font-family: inherit; font-size: 1rem; font-weight: 700;
      letter-spacing: .03em; transition: background .15s, transform .12s;
    }
    .pfh-cta:hover  { background: var(--ps-blue2); transform: translateY(-1px); }
    .pfh-cta:active { transform: translateY(0); }

    /* ── Offer Grid ──────────────────────────────────────────────────── */
    .og-section { background: #050510; padding: 2.5rem 2rem 5rem; }
    .og-header  { max-width: 1100px; margin: 0 auto 2rem; }
    .og-eyebrow { font-size: .7rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--ps-cyan); margin-bottom: .75rem; }
    .og-title   { font-size: 1.5rem; font-weight: 900; margin-bottom: .375rem; }
    .og-sub     { font-size: .9375rem; color: var(--ps-muted); line-height: 1.6; }
    .og-grid    { display: grid; grid-template-columns: repeat(3,1fr); gap: 1.5rem; max-width: 1100px; margin: 0 auto; }
    .og-card {
      background: var(--ps-card); border-radius: 10px; overflow: hidden;
      border: 1px solid var(--ps-border); transition: border-color .2s, transform .2s, box-shadow .2s;
    }
    .og-card:hover { border-color: rgba(255,255,255,.2); transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,.5); }
    .og-cover {
      width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block;
      background: linear-gradient(135deg,var(--ps-blue),var(--ps-blue2));
    }
    .og-body  { padding: 1.25rem; }
    .og-badge { display: inline-block; font-size: .65rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; background: var(--ps-blue); color: var(--ps-white); padding: .2rem .625rem; border-radius: 2px; margin-bottom: .625rem; }
    .og-title-f { font-size: .9375rem; font-weight: 700; margin-bottom: .5rem; line-height: 1.35; }
    .og-desc    { font-size: .8125rem; color: var(--ps-muted); line-height: 1.55; margin-bottom: .875rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .og-footer  { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
    .og-price   { font-size: 1rem; font-weight: 900; }
    .og-cart    { background: var(--ps-blue); color: var(--ps-white); border: none; border-radius: 3px; padding: .45rem 1rem; font-family: inherit; font-size: .8125rem; font-weight: 700; transition: background .15s; }
    .og-cart:hover { background: var(--ps-blue2); }

    /* ── Card Expand Overlay ─────────────────────────────────────────── */
    .og-expand-backdrop {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,.82); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      perspective: 1200px;
      animation: bdIn .25s ease forwards;
    }
    .og-expand-backdrop.closing { animation: bdOut .52s ease forwards; pointer-events: none; }
    @keyframes bdIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes bdOut { from { opacity: 1; } to { opacity: 0; } }
    .og-expand-card {
      position: relative; width: min(480px, 92vw);
      background: var(--ps-card); border-radius: 14px;
      border: 1px solid rgba(255,255,255,.18); overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,.75);
      transform-style: preserve-3d;
      animation: flipZoomIn .7s cubic-bezier(.22,1,.36,1) forwards;
    }
    .og-expand-card.closing { animation: settleDown .52s cubic-bezier(.4,0,1,1) forwards; }
    @keyframes flipZoomIn {
      0%   { transform: scale(0.28) rotateY(720deg); opacity: 0; }
      60%  { transform: scale(0.9)  rotateY(80deg);  opacity: 1; }
      100% { transform: scale(1)    rotateY(0deg);   opacity: 1; }
    }
    @keyframes settleDown {
      0%   { transform: translateY(0)    scale(1);   opacity: 1; }
      55%  { transform: translateY(38px) scale(.91); opacity: .85; }
      100% { transform: translateY(110px) scale(.68); opacity: 0; }
    }
    .og-expand-cover  { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: linear-gradient(135deg,var(--ps-blue),var(--ps-blue2)); }
    .og-expand-body   { padding: 1.5rem 1.5rem 0; }
    .og-expand-footer { padding: 1.25rem 1.5rem 1.5rem; }
    .og-expand-badge  { display: inline-block; font-size: .65rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; background: var(--ps-blue); color: var(--ps-white); padding: .2rem .625rem; border-radius: 2px; margin-bottom: .625rem; }
    .og-expand-title  { font-size: 1.25rem; font-weight: 800; margin-bottom: .75rem; line-height: 1.3; }
    .og-expand-desc   { font-size: .9rem; color: var(--ps-muted); line-height: 1.7; margin-bottom: 1.1rem; }
    .og-expand-price  { font-size: 1.125rem; font-weight: 900; margin-bottom: 1.25rem; }
    .og-expand-close  { display: block; width: 100%; text-align: center; background: rgba(255,255,255,.08); color: var(--ps-white); border: 1px solid rgba(255,255,255,.18); border-radius: 4px; padding: .75rem; font-family: inherit; font-size: .9rem; font-weight: 700; cursor: pointer; transition: background .15s; }
    .og-expand-close:hover { background: rgba(255,255,255,.14); }
    .og-expand-x { position: absolute; top: .75rem; right: .75rem; width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.2); color: var(--ps-white); font-size: .9rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .15s; z-index: 2; }
    .og-expand-x:hover { background: rgba(255,255,255,.15); }

    /* ── Footer ──────────────────────────────────────────────────────── */
    .ps-footer {
      background: #0a0a0a; border-top: 1px solid var(--ps-border);
      padding: 2.5rem 2rem; text-align: center;
      font-size: .8125rem; color: rgba(255,255,255,.28);
    }
  </style>
</head>

  <script>
  (function () {

      return fetch(
        PUBLISH + '/graphql/execute.json/global/heroByPath3;path=' + path + ';variation=master;_t=' + Date.now(),

    /* ── NavBar ──────────────────────────────────────────────────────── */
    function NavBar() {
      return h('nav', { className: 'ps-nav' },

          h('nav', { className: 'ps-nav-links' },

        h('div', { className: 'ps-nav-right' },
          h('a', { href: DA_EDIT_URL, target: '_blank', rel: 'noreferrer' },

          h('button', { className: 'ps-nav-signin' }, 'Sign In'),

    /* ── Architecture explainer ──────────────────────────────────────── */
    function ArchExplainer() {
      return h('section', { className: 'arch-section' },
        h('div', { className: 'arch-inner' },
          h('p',  { className: 'arch-headline' }, 'Content Architecture'),

          h('p',  { className: 'arch-sub' },
            'The hero below is an HTML fragment fetched from EDS. The offers come from AEM Content Fragments via GraphQL. ' +
            'The countdown is rendered by React and layered on top of the fragment at runtime.'),
          h('div', { className: 'arch-cards' },
            h('div', { className: 'arch-card eds' },
              h('p',  { className: 'arch-card-label' }, '⬡ EDS Fragment — Document Authoring'),

              ),
              h('div', { className: 'arch-card-edit' },
                h('a', { href: DA_EDIT_URL, target: '_blank', rel: 'noreferrer', className: 'btn-da', style: { display: 'inline-flex' } },
                  '✎ Open in DA Live'),
              ),
            ),
            h('div', { className: 'arch-card aem' },
              h('p',  { className: 'arch-card-label' }, '◈ AEM Content Fragments + Universal Editor'),
              h('p',  { className: 'arch-card-name' }, 'Offer cards: title, price, description, image'),
              h('ul', { className: 'arch-rows' },
                h('li', null, 'Authored as Content Fragments in AEM Cloud Service'),
                h('li', null, 'Delivered via persisted GraphQL query from AEM Publish'),
                h('li', null, 'Query returns typed JSON — images, rich text, price, badge'),
                h('li', null, 'In-context editing in this page via Universal Editor'),
              ),
              h('div', { className: 'arch-card-edit' },
                h('a', { href: UE_EDIT_URL, target: '_blank', rel: 'noreferrer', className: 'btn-ue', style: { display: 'inline-flex' } },
                  '✎ Open in Universal Editor'),
              ),
            ),
          ),
        ),
      );
    }

    /* ── Hero fragment + React countdown overlay ─────────────────────── */
    function FragHeroSection(props) {
      var parts = useCountdown(HERO_EXPIRY);
      return h('section', { className: 'frag-hero-section' },
        h('div', { className: 'src-ribbon eds-ribbon' },
          h('span', { className: 'src-ribbon-dot' }),
          'EDS Fragment · plain HTML GET · no auth · no GraphQL — imagery, headline, description',
          h('span', { className: 'src-ribbon-spacer' }),
          h('a', { href: DA_EDIT_URL, target: '_blank', rel: 'noreferrer', className: 'src-ribbon-link' },
            'Edit this fragment in DA Live →'),
        ),
        props.html === null
          ? h('div', { className: 'ps-loading' }, 'Loading fragment…')
          : h('div', { className: 'frag-hero-wrapper' },
              h('div', { dangerouslySetInnerHTML: { __html: props.html } }),
              h('div', { className: 'frag-inject-layer' },
                h('span', { className: 'frag-inject-label' }, '⬡ React SPA — countdown + CTA'),
                h('div', { className: 'countdown' },
                  ['d','h','m','s'].map(function (u) {
                    return h('div', { key: u, className: 'countdown-block' },
                      h('span', { className: 'countdown-num' }, String(parts[u]).padStart(2, '0')),
                      h('span', { className: 'countdown-label' }, u),
                    );
                  }),
                ),
                h('button', { className: 'pfh-cta' }, 'Shop the Sale'),
              ),
            ),
      );
    }

    /* ── OfferCard ───────────────────────────────────────────────────── */
    function OfferCard(props) {
      var item  = props.item; var slug = props.slug;
      var fp    = FRAG(slug);
      var desc  = (item.description && (item.description.plaintext || item.description)) || '';
      var cover = item.image && item.image._publishUrl;
      var _ex = useState(false); var expanded = _ex[0]; var setExpanded = _ex[1];
      var _cl = useState(false); var closing  = _cl[0]; var setClosing  = _cl[1];
      var timerRef = useRef(null);

      function openCard()  { setExpanded(true);  setClosing(false); }
      function closeCard() {
        setClosing(true);
        timerRef.current = setTimeout(function () { setExpanded(false); setClosing(false); }, 520);
      }
      useEffect(function () { return function () { clearTimeout(timerRef.current); }; }, []);

      var modal = expanded ? ReactDOM.createPortal(
        h('div', { className: 'og-expand-backdrop' + (closing ? ' closing' : ''), onClick: closeCard },
          h('div', { className: 'og-expand-card' + (closing ? ' closing' : ''), onClick: function (e) { e.stopPropagation(); } },
            h('button', { className: 'og-expand-x', onClick: closeCard, 'aria-label': 'Close' }, '✕'),
            cover ? h('img', { className: 'og-expand-cover', src: cover, alt: item.title || '' }) : h('div', { className: 'og-expand-cover' }),
            h('div', { className: 'og-expand-body' },
              h('span', { className: 'og-expand-badge' }, item.eyebrow || ''),
              h('p',    { className: 'og-expand-title' }, item.title   || ''),
              h('p',    { className: 'og-expand-desc'  }, desc),
              h('p',    { className: 'og-expand-price' }, item.ctaLabel || ''),
            ),
            h('div', { className: 'og-expand-footer' },
              h('button', { className: 'og-expand-close', onClick: closeCard }, 'Close'),
            ),
          ),
        ),
        document.body,
      ) : null;

      return h(_React.Fragment, null,
        h('div', Object.assign({ className: 'og-card' }, aueRes(fp, item.title || slug)),
          cover ? h('img', { className: 'og-cover', src: cover, alt: item.title || '', loading: 'lazy' }) : h('div', { className: 'og-cover' }),
          h('div', { className: 'og-body' },
            h('span', Object.assign({ className: 'og-badge'   }, aueField(fp, 'eyebrow',     'text',     'Badge')),       item.eyebrow  || ''),
            h('p',    Object.assign({ className: 'og-title-f' }, aueField(fp, 'title',       'text',     'Title')),       item.title    || ''),
            h('p',    Object.assign({ className: 'og-desc'    }, aueField(fp, 'description', 'richtext', 'Description')), desc),
            h('div', { className: 'og-footer' },
              h('span',   Object.assign({ className: 'og-price' }, aueField(fp, 'ctaLabel', 'text', 'Price')), item.ctaLabel || ''),
              h('button', { className: 'og-cart', onClick: openCard }, 'Details'),
            ),
          ),
        ),
        modal,
      );
    }

    /* ── Offer Grid ──────────────────────────────────────────────────── */
    var GRID_SLUGS = ['ps-spiderman', 'ps-god-of-war', 'ps-ghost'];
    function OfferGrid(props) {
      return h('section', { className: 'og-section' },
        h('div', { className: 'src-ribbon aem-ribbon' },
          h('span', { className: 'src-ribbon-dot' }),
          'AEM Content Fragments · persisted GraphQL from AEM Publish · in-context editing via Universal Editor',
          h('span', { className: 'src-ribbon-spacer' }),
          h('a', { href: UE_EDIT_URL, target: '_blank', rel: 'noreferrer', className: 'src-ribbon-link' },
            'Edit these offers in Universal Editor →'),
        ),
        h('div', { className: 'og-header' },
          h('p',  { className: 'og-eyebrow' }, 'Limited Time Offers'),
          h('h2', { className: 'og-title' }, "This Week's Top Deals"),
          h('p',  { className: 'og-sub' }, 'Content from AEM Content Fragments via persisted GraphQL. Click Details for full description.'),
        ),
        h('div', { className: 'og-grid' },
          GRID_SLUGS.map(function (slug) {
            var item = (props.offers && props.offers[slug]) || FALLBACK_OFFERS[slug];
            return h(OfferCard, { key: slug, item: item, slug: slug });
          }),
        ),
      );
    }

    /* ── Footer ──────────────────────────────────────────────────────── */
    function Footer() {
      return h('footer', { className: 'ps-footer' },
        'Hero fragment: EDS plain HTML · Countdown + CTA: React SPA · Offers: AEM Content Fragments + GraphQL · Demo only.'
      );
    }

    /* ── App ─────────────────────────────────────────────────────────── */
    function App() {
      var _html   = useState(null);            var fragHtml = _html[0];  var setFragHtml = _html[1];
      var _offers = useState(FALLBACK_OFFERS); var offers   = _offers[0]; var setOffers   = _offers[1];

      useEffect(function () {
        fetchEdsFragment()
          .then(setFragHtml)
          .catch(function () { setFragHtml(''); });

        Promise.allSettled([
          fetchHero('ps-spiderman'),
          fetchHero('ps-god-of-war'),
          fetchHero('ps-ghost'),
        ]).then(function (res) {
          var slugs = ['ps-spiderman', 'ps-god-of-war', 'ps-ghost'];
          var map = Object.assign({}, FALLBACK_OFFERS);
          slugs.forEach(function (s, i) {
            var v = res[i].value;
            if (v) {
              if (!(v.image && v.image._publishUrl)) v = Object.assign({}, v, { image: FALLBACK_OFFERS[s].image });
              map[s] = v;
            }
          });
          setOffers(map);
        }).catch(function () {});
      }, []);

      return h('div', null,
        h(NavBar),
        h(ArchExplainer),
        h(FragHeroSection, { html: fragHtml }),
        h(OfferGrid, { offers: offers }),
        h(Footer),
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(h(App));
  })();
  </script>
</body>
