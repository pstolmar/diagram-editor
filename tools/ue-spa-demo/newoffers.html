    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      display: flex; align-items: center; justify-content: space-between;

    .hero-img-right {
      position: absolute; top: 0; right: 0;
      height: 100%; width: auto; object-fit: contain; z-index: 1;
