<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="urn:adobe:aue:system:aem" content="aem:https://author-p138879-e1741192.adobeaemcloud.com"/>
  <title>Luma — EDS Platform Demo</title>
  <script src="https://universal-editor-service.adobe.io/cors.js" async></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --luma-purple: #7C3AED; --luma-purple2: #6D28D9; --luma-gold: #F59E0B;
      --luma-teal: #0891B2;   --luma-dark: #0C0A1A;   --luma-card: #16123A;
      --luma-border: rgba(255,255,255,.08); --luma-muted: rgba(255,255,255,.6);
      --adobe-red: #EB1000;   --adobe-blue: #1473E6;  --ai-color: #7DD3FC;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--luma-dark); color: #fff; overflow-x: hidden; }
    img { display: block; } button { cursor: pointer; } a { text-decoration: none; color: inherit; }
    .spin { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Nav ── */
    .nav {
      position: sticky; top: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 2rem; height: 56px;
      background: rgba(12,10,26,.96); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--luma-border);
    }
    .nav-left { display: flex; align-items: center; gap: 2.5rem; }
    .nav-wordmark { font-size: 1.125rem; font-weight: 900; letter-spacing: -.03em; color: #fff; }
    .nav-wordmark span { color: var(--luma-gold); }
    .nav-links { display: flex; gap: 1.75rem; }
    .nav-links a { font-size: .875rem; font-weight: 500; color: var(--luma-muted); transition: color .15s; }
    .nav-links a:hover { color: #fff; }
    .nav-right { display: flex; align-items: center; gap: .5rem; }
    .nav-slot-pill {
      display: flex; align-items: center; gap: .375rem;
      background: rgba(255,255,255,.06); border: 1px solid var(--luma-border);
      border-radius: 20px; padding: .3rem .875rem;
      font-size: .75rem; font-weight: 600; color: var(--luma-muted);
    }
    .nav-slot-dot { width: 6px; height: 6px; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
    .btn-ai {
      display: inline-flex; align-items: center; gap: .35rem;
      background: rgba(125,211,252,.12); color: var(--ai-color);
      border: 1px solid rgba(125,211,252,.25); border-radius: 4px;
      padding: .4rem .9rem; font-family: inherit; font-size: .8rem; font-weight: 700;
    }
    .btn-ue {
      display: inline-flex; align-items: center; gap: .35rem;
      background: var(--luma-purple); color: #fff; border: none; border-radius: 4px;
      padding: .4rem .9rem; font-family: inherit; font-size: .8rem; font-weight: 700;
      transition: background .15s;
    }
    .btn-ue:hover { background: var(--luma-purple2); }

    /* ── Architecture Diagram ── */
    .arch { background: #08061A; padding: 4rem 2rem; border-bottom: 1px solid var(--luma-border); }
    .arch-inner { max-width: 1100px; margin: 0 auto; }
    .arch-hed { font-size: .7rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--luma-muted); margin-bottom: .5rem; }
    .arch-title { font-size: 1.5rem; font-weight: 900; margin-bottom: .375rem; }
    .arch-sub { font-size: .9rem; color: var(--luma-muted); margin-bottom: 2.5rem; line-height: 1.6; max-width: 640px; }
    .arch-layers { display: flex; flex-direction: column; gap: 0; }
    .arch-layer { padding: 1rem 0; }
    .arch-layer-label {
      font-size: .6rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase;
      margin-bottom: .625rem; display: flex; align-items: center; gap: .5rem;
    }
    .arch-layer-label::after { content: ''; flex: 1; height: 1px; background: var(--luma-border); }
    .arch-nodes { display: flex; gap: .75rem; flex-wrap: wrap; }
    .arch-node {
      display: flex; align-items: center; gap: .5rem;
      background: rgba(255,255,255,.04); border-radius: 8px;
      border: 1px solid var(--luma-border);
      padding: .6rem 1rem; font-size: .8125rem; font-weight: 600;
      position: relative; transition: border-color .2s, background .2s;
      cursor: default;
    }
    .arch-node:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.2); }
    .arch-node-icon { font-size: 1rem; flex-shrink: 0; }
    .arch-connector {
      display: flex; justify-content: center; align-items: center;
      padding: .375rem 0; gap: 4px; overflow: hidden;
    }
    .arch-dot {
      width: 5px; height: 5px; border-radius: 50%;
      animation: flowDot 1.8s linear infinite;
      flex-shrink: 0;
    }
    .arch-dot:nth-child(2) { animation-delay: .3s; }
    .arch-dot:nth-child(3) { animation-delay: .6s; }
    .arch-dot:nth-child(4) { animation-delay: .9s; }
    .arch-dot:nth-child(5) { animation-delay: 1.2s; }
    .arch-dot:nth-child(6) { animation-delay: 1.5s; }
    @keyframes flowDot { 0%,60%,100% { opacity:.15; transform: scale(.8); } 30% { opacity:1; transform: scale(1.2); } }
    .arch-legend { margin-top: 1.5rem; font-size: .75rem; color: var(--luma-muted); border-top: 1px solid var(--luma-border); padding-top: 1rem; }

    /* Layer colors */
    .l-authoring  { color: var(--luma-gold);   } .l-authoring  .arch-dot { background: var(--luma-gold); }
    .l-edge       { color: var(--luma-teal);   } .l-edge       .arch-dot { background: var(--luma-teal); }
    .l-experience { color: var(--luma-purple); } .l-experience .arch-dot { background: var(--luma-purple); }
    .l-ai         { color: var(--ai-color);    } .l-ai         .arch-dot { background: var(--ai-color); }

    /* ── Rotating Hero ── */
    .hero { position: relative; width: 100%; height: 580px; overflow: hidden; background: #050310; }
    .hero-bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center 30%;
      transition: opacity .6s ease;
    }
    .hero-overlay {
      position: absolute; top: 0; bottom: 0; left: 0; width: 55%;
      padding: 3.5rem 3.5rem; z-index: 4;
      display: flex; flex-direction: column; justify-content: center;
      background: linear-gradient(90deg, rgba(12,10,26,.97) 0%, rgba(12,10,26,.92) 75%, transparent 100%);
    }
    .hero-slot-badge {
      display: inline-flex; align-items: center; gap: .5rem;
      font-size: .65rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
      color: var(--luma-gold); margin-bottom: .875rem;
    }
    .hero-slot-badge::before { content: ''; width: 16px; height: 2px; background: var(--luma-gold); }
    .hero-dm-pill {
      display: inline-flex; align-items: center; gap: .4rem;
      background: rgba(124,58,237,.18); border: 1px solid rgba(124,58,237,.35);
      border-radius: 20px; padding: .25rem .75rem;
      font-size: .65rem; font-weight: 700; color: #c4b5fd;
      margin-bottom: 1.25rem; align-self: flex-start;
    }
    .hero-title {
      font-size: clamp(2rem, 4vw, 3.5rem); font-weight: 900; line-height: 1.08;
      letter-spacing: -.025em; margin-bottom: .875rem;
    }
    .hero-desc { font-size: .9375rem; line-height: 1.65; color: var(--luma-muted); max-width: 400px; margin-bottom: 2rem; }
    .hero-cta {
      align-self: flex-start; background: var(--luma-gold); color: #000; border: none;
      border-radius: 4px; padding: .875rem 2.25rem;
      font-family: inherit; font-size: .9375rem; font-weight: 800;
      transition: opacity .15s, transform .12s;
    }
    .hero-cta:hover { opacity: .9; transform: translateY(-1px); }
    .hero-slots-bar {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 5;
      display: flex; height: 4px;
    }
    .hero-slot-seg { flex: 1; transition: background .3s; }
    .hero-countdown {
      position: absolute; bottom: 1.5rem; right: 2.5rem; z-index: 5;
      display: flex; align-items: center; gap: .75rem;
    }
    .hero-countdown-label { font-size: .65rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--luma-muted); }
    .hero-cd-blocks { display: flex; gap: .375rem; }
    .hero-cd-block {
      display: flex; flex-direction: column; align-items: center;
      background: rgba(255,255,255,.08); border-radius: 4px; padding: .35rem .625rem; min-width: 38px;
    }
    .hero-cd-num { font-size: 1.125rem; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; color: var(--luma-gold); }
    .hero-cd-lab { font-size: .5rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--luma-muted); margin-top: .2rem; }

    /* ── Content Grid ── */
    .grid-section { background: #0A081E; padding: 4rem 2rem; }
    .grid-inner { max-width: 1100px; margin: 0 auto; }
    .grid-hed { font-size: .7rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--luma-teal); margin-bottom: .5rem; }
    .grid-title { font-size: 1.5rem; font-weight: 900; margin-bottom: .375rem; }
    .grid-qi-note {
      display: inline-flex; align-items: center; gap: .5rem;
      background: rgba(8,145,178,.08); border: 1px solid rgba(8,145,178,.2);
      border-radius: 4px; padding: .35rem .875rem; margin-bottom: 1.5rem;
      font-size: .75rem; font-family: monospace; color: var(--luma-teal);
    }
    .grid-filters { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 2rem; }
    .grid-filter {
      padding: .4rem 1.1rem; border-radius: 20px; font-family: inherit;
      font-size: .8125rem; font-weight: 600;
      border: 1px solid var(--luma-border); background: transparent; color: var(--luma-muted);
      transition: all .2s;
    }
    .grid-filter.active { background: var(--luma-purple); border-color: var(--luma-purple); color: #fff; }
    .grid-filter:hover:not(.active) { border-color: rgba(255,255,255,.3); color: #fff; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
    .grid-card {
      background: var(--luma-card); border-radius: 10px; overflow: hidden;
      border: 1px solid var(--luma-border); transition: border-color .2s, transform .2s, box-shadow .2s;
    }
    .grid-card:hover { border-color: rgba(255,255,255,.18); transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,.5); }
    .grid-img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--luma-purple2); }
    .grid-body { padding: 1.125rem; }
    .grid-meta { display: flex; align-items: center; gap: .5rem; margin-bottom: .625rem; flex-wrap: wrap; }
    .msm-badge {
      font-size: .6rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
      padding: .15rem .5rem; border-radius: 3px;
    }
    .msm-inherited { background: rgba(245,158,11,.1);  color: var(--luma-gold); }
    .msm-localized  { background: rgba(124,58,237,.15); color: #c4b5fd; }
    .msm-global     { background: rgba(8,145,178,.12);  color: var(--luma-teal); }
    .wf-dot { width: 7px; height: 7px; border-radius: 50%; }
    .wf-live     { background: #22C55E; box-shadow: 0 0 5px #22C55E; }
    .wf-review   { background: var(--luma-gold); }
    .wf-approved { background: var(--luma-teal); }
    .wf-draft    { background: #6B7280; }
    .wf-label { font-size: .65rem; color: var(--luma-muted); font-weight: 600; }
    .grid-card-title  { font-size: .9375rem; font-weight: 700; margin-bottom: .375rem; line-height: 1.3; }
    .grid-card-desc   { font-size: .8125rem; color: var(--luma-muted); line-height: 1.55; margin-bottom: .875rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .grid-card-footer { display: flex; align-items: center; justify-content: space-between; }
    .grid-card-price  { font-size: 1rem; font-weight: 900; color: var(--luma-gold); }
    .grid-card-btn    { background: var(--luma-purple); color: #fff; border: none; border-radius: 3px; padding: .4rem .9rem; font-family: inherit; font-size: .8125rem; font-weight: 700; transition: background .15s; }
    .grid-card-btn:hover { background: var(--luma-purple2); }

    /* ── Expand Modal ── */
    .exp-backdrop {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,.85); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      perspective: 1200px;
      animation: bdIn .25s ease forwards;
    }
    .exp-backdrop.closing { animation: bdOut .52s ease forwards; pointer-events: none; }
    @keyframes bdIn  { from { opacity:0; } to { opacity:1; } }
    @keyframes bdOut { from { opacity:1; } to { opacity:0; } }
    .exp-card {
      position: relative; width: min(500px, 92vw);
      background: var(--luma-card); border-radius: 14px;
      border: 1px solid rgba(255,255,255,.18); overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,.8);
      transform-style: preserve-3d;
      animation: flipIn .7s cubic-bezier(.22,1,.36,1) forwards;
    }
    .exp-card.closing { animation: settleOut .52s cubic-bezier(.4,0,1,1) forwards; }
    @keyframes flipIn { 0% { transform: scale(.28) rotateY(720deg); opacity:0; } 60% { transform: scale(.9) rotateY(80deg); opacity:1; } 100% { transform: scale(1) rotateY(0deg); opacity:1; } }
    @keyframes settleOut { 0% { transform: translateY(0) scale(1); opacity:1; } 55% { transform: translateY(38px) scale(.91); opacity:.85; } 100% { transform: translateY(110px) scale(.68); opacity:0; } }
    .exp-x { position: absolute; top: .75rem; right: .75rem; z-index:2; width:30px; height:30px; border-radius:50%; background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.2); color:#fff; font-size:.9rem; display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .exp-img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background: var(--luma-purple2); }
    .exp-body { padding: 1.5rem 1.5rem 0; }
    .exp-meta { display:flex; align-items:center; gap:.5rem; margin-bottom:.75rem; }
    .exp-title { font-size:1.25rem; font-weight:800; margin-bottom:.625rem; }
    .exp-desc { font-size:.9rem; color:var(--luma-muted); line-height:1.7; margin-bottom:.875rem; }
    .exp-details { font-size:.75rem; color:rgba(255,255,255,.35); line-height:1.8; margin-bottom:1rem; border-top:1px solid var(--luma-border); padding-top:.875rem; }
    .exp-price { font-size:1.25rem; font-weight:900; color:var(--luma-gold); margin-bottom:1.25rem; }
    .exp-footer { padding: 1.25rem 1.5rem 1.5rem; }
    .exp-close { display:block; width:100%; text-align:center; background:rgba(255,255,255,.07); color:#fff; border:1px solid rgba(255,255,255,.15); border-radius:4px; padding:.75rem; font-family:inherit; font-size:.9rem; font-weight:700; cursor:pointer; }

    /* ── DM Visualizer ── */
    .dm-section { background: var(--luma-dark); padding: 4rem 2rem; border-top: 1px solid var(--luma-border); }
    .dm-inner { max-width: 1100px; margin: 0 auto; }
    .dm-hed { font-size: .7rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--luma-purple); margin-bottom: .5rem; }
    .dm-title { font-size: 1.5rem; font-weight: 900; margin-bottom: .375rem; }
    .dm-sub { font-size: .9rem; color: var(--luma-muted); margin-bottom: 2rem; line-height: 1.6; }
    .dm-layout { display: grid; grid-template-columns: 1fr 1.1fr 1fr; gap: 1.5rem; align-items: start; }
    .dm-panel { background: var(--luma-card); border-radius: 10px; border: 1px solid var(--luma-border); padding: 1.5rem; }
    .dm-panel-title { font-size: .7rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--luma-muted); margin-bottom: 1.125rem; }
    .dm-field { margin-bottom: 1.125rem; }
    .dm-label { font-size: .75rem; font-weight: 600; color: var(--luma-muted); margin-bottom: .35rem; display: block; }
    .dm-select, .dm-range {
      width: 100%; background: rgba(255,255,255,.06); border: 1px solid var(--luma-border);
      border-radius: 4px; color: #fff; padding: .5rem .75rem;
      font-family: inherit; font-size: .8125rem; appearance: none;
    }
    .dm-range { padding: 0; height: 4px; accent-color: var(--luma-purple); cursor: pointer; }
    .dm-url-box {
      background: rgba(0,0,0,.4); border: 1px solid var(--luma-border); border-radius: 6px; padding: 1rem;
      font-family: monospace; font-size: .78rem; line-height: 1.8; word-break: break-all;
      margin-bottom: .875rem; min-height: 120px;
    }
    .dm-url-base { color: var(--luma-muted); }
    .dm-url-param { color: var(--luma-gold); }
    .dm-url-preset { color: #c4b5fd; }
    .dm-copy {
      width: 100%; background: var(--luma-purple); color: #fff; border: none; border-radius: 4px;
      padding: .625rem; font-family: inherit; font-size: .8125rem; font-weight: 700; transition: background .15s;
    }
    .dm-copy:hover { background: var(--luma-purple2); }
    .dm-preview-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 6px; display: block; transition: opacity .3s; }
    .dm-preview-label { font-size: .7rem; color: var(--luma-muted); text-align: center; margin-top: .625rem; }

    /* ── AI Content Advisor ── */
    .ai-section { background: #08061A; padding: 4rem 2rem; border-top: 1px solid var(--luma-border); }
    .ai-inner { max-width: 1100px; margin: 0 auto; }
    .ai-header { display: flex; align-items: center; gap: 1rem; margin-bottom: .375rem; }
    .ai-badge { display: inline-flex; align-items: center; gap: .4rem; background: rgba(125,211,252,.1); border: 1px solid rgba(125,211,252,.2); border-radius: 20px; padding: .3rem .875rem; font-size: .7rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ai-color); }
    .ai-title { font-size: 1.5rem; font-weight: 900; margin-bottom: .375rem; }
    .ai-sub { font-size: .9rem; color: var(--luma-muted); margin-bottom: 2rem; line-height: 1.6; max-width: 640px; }
    .ai-recs { display: grid; grid-template-columns: repeat(3,1fr); gap: 1.25rem; margin-bottom: 2.5rem; }
    .ai-rec {
      background: rgba(255,255,255,.03); border-radius: 10px;
      border: 1px solid rgba(125,211,252,.12); padding: 1.375rem;
    }
    .ai-rec-type { font-size: .65rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--ai-color); margin-bottom: .625rem; }
    .ai-rec-body { font-size: .875rem; color: var(--luma-muted); line-height: 1.65; margin-bottom: 1.25rem; }
    .ai-rec-action { background: rgba(125,211,252,.1); color: var(--ai-color); border: 1px solid rgba(125,211,252,.25); border-radius: 3px; padding: .4rem .875rem; font-family: inherit; font-size: .8rem; font-weight: 700; }
    .ai-gv-title { font-size: 1rem; font-weight: 800; margin-bottom: 1.25rem; }
    .ai-gv-cards { display: grid; grid-template-columns: repeat(3,1fr); gap: 1.25rem; }
    .ai-gv-card {
      background: rgba(255,255,255,.03); border-radius: 8px;
      border: 1px solid var(--luma-border); padding: 1.125rem;
      position: relative;
    }
    .ai-gv-label { position: absolute; top: -10px; left: 1rem; font-size: .6rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--luma-purple); background: #08061A; padding: 0 .375rem; }
    .ai-gv-text { font-size: .8125rem; color: var(--luma-muted); line-height: 1.6; border-left: 2px solid rgba(124,58,237,.4); padding-left: .75rem; }

    /* ── Footer ── */
    .footer { background: #050310; border-top: 1px solid var(--luma-border); padding: 3rem 2rem; }
    .footer-inner { max-width: 1100px; margin: 0 auto; }
    .footer-title { font-size: .875rem; font-weight: 800; margin-bottom: 1.25rem; color: var(--luma-muted); letter-spacing: .05em; text-transform: uppercase; }
    .footer-table { width: 100%; border-collapse: collapse; }
    .footer-table th { font-size: .65rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--luma-muted); padding: .5rem 0; border-bottom: 1px solid var(--luma-border); text-align: left; }
    .footer-table td { font-size: .8125rem; padding: .625rem 0; border-bottom: 1px solid rgba(255,255,255,.04); vertical-align: top; }
    .footer-table td:first-child { color: var(--luma-muted); width: 20%; }
    .footer-table td:nth-child(2) { width: 50%; color: rgba(255,255,255,.8); }
    .footer-table td:last-child { color: var(--luma-purple); font-weight: 600; width: 30%; }
    .footer-copy { margin-top: 2rem; font-size: .8125rem; color: rgba(255,255,255,.2); }
  </style>
</head>

<div id="app"></div>
<script>
(function () {
  'use strict';
  var _React   = React;

  var useEffect = _React.useEffect;

            h('div', { className: 'dm-field' },
              h('label', { className: 'dm-label' }, 'Brightness: ' + (Number(bri) > 0 ? '+' : '') + bri),
              h('input', { className: 'dm-range', type: 'range', min: '-10', max: '10', value: bri, onChange: function (e) { setBri(e.target.value); } }),
            ),
          ),
          /* URL output */
          h('div', { className: 'dm-panel' },
            h('p', { className: 'dm-panel-title' }, '🔗 Computed DM URL'),
            h('div', { className: 'dm-url-box' },
              h('span', { className: 'dm-url-base' }, base),
              h('span', { className: 'dm-url-param' }, '?fmt=' + fmt + '&wid=' + wid),
              bri !== '0' && h('span', { className: 'dm-url-param' }, '&op_brightness=' + (Number(bri) > 0 ? '+' : '') + bri),
              sc === 'on' && h('span', { className: 'dm-url-param' }, '&crop=auto'),
              preset !== 'none' && h('span', { className: 'dm-url-preset' }, '&' + preset),
            ),
            h('button', { className: 'dm-copy', onClick: copyUrl }, copied ? '✓ Copied!' : 'Copy URL'),
          ),
          /* Preview */
          h('div', { className: 'dm-panel' },
            h('p', { className: 'dm-panel-title' }, '👁 Simulated Preview'),
            h('img', {
              className: 'dm-preview-img',
              src: previewSrc,
              alt: 'DM preview',
              key: preset + '-' + wid,
              style: { filter: cssFilter || 'none', transition: 'filter .4s ease' },
            }),
            h('p', { className: 'dm-preview-label' }, wid + 'px · ' + fmt + (preset !== 'none' ? ' · ' + preset : '') + (bri !== '0' ? ' · bri ' + (Number(bri) > 0 ? '+' : '') + bri : '')),
          ),
        ),
      ),
    );
  }

  /* ── AI Content Advisor ── */
  function AiAdvisorPanel() {
    var RECS = [
      { type: 'Performance Alert', body: 'Evening Restore hero has 23% lower CTR this week vs. last. Try swapping to the vibration roller product image for the $evening-cool$ preset — similar offers saw +18% improvement.', action: 'Apply Suggestion' },
      { type: 'Content Gap', body: 'No approved content for the Afternoon slot in the Nutrition category. Query index shows 0 results for tag "afternoon,nutrition". Generate with Firefly + Generate Variations?', action: 'Generate with Firefly' },
      { type: 'MSM Rollout', body: '3 localized variants have drifted significantly from their Blueprint. Luma Band Ultra copy differs by 40%+ in EN-GB and DE. Consider a selective rollout sync.', action: 'Review Rollouts' },
    ];
    var GV_VARIANTS = [
      { label: 'Original', text: 'Sustainable cork + natural rubber. Non-slip surface, extra wide 72". Ships with carry strap.' },
      { label: 'Conversion', text: 'Join 50,000 Luma athletes. Our top-rated mat — non-slip, eco-certified, arrives in 2 days. Limited stock.' },
      { label: 'SEO', text: 'Eco yoga mat with natural cork grip. Extra-wide 72" non-slip surface. Sustainable, durable, Luma-certified for all practice levels.' },
    ];

    return h('section', { className: 'ai-section', id: 'ai-section' },
      h('div', { className: 'ai-inner' },
        h('div', { className: 'ai-header' },
          h('div', { className: 'ai-badge' }, '✦ AI'),
        ),
        h('h2', { className: 'ai-title' }, 'Content Advisor'),
        h('p',  { className: 'ai-sub' }, 'Adobe AI surfaces performance signals, content gaps, and MSM drift — directly in the authoring workflow. These recommendations would appear in Experience Workspace alongside the page you\'re editing.'),
        h('div', { className: 'ai-recs' },
          RECS.map(function (r) {
            return h('div', { key: r.type, className: 'ai-rec' },
              h('p',    { className: 'ai-rec-type' }, r.type),
              h('p',    { className: 'ai-rec-body' }, r.body),
              h('button', { className: 'ai-rec-action' }, r.action),
            );
          }),
        ),
        h('p', { className: 'ai-gv-title' }, 'Generate Variations — Eco Yoga Mat Pro'),
        h('div', { className: 'ai-gv-cards' },
          GV_VARIANTS.map(function (v) {
            return h('div', { key: v.label, className: 'ai-gv-card' },
              h('span', { className: 'ai-gv-label' }, v.label),
              h('p',    { className: 'ai-gv-text' }, v.text),
            );
          }),
        ),
      ),
    );
  }

  /* ── Footer ── */
  function Footer() {
    var rows = [
      ['Hero content',    'AEM CF time-slot parameters → DM preset → EDS CDN',   'Universal Editor / Canvas'],
      ['Content grid',    'EDS query-index.json → filter by tag/slot',            'Quick Edit / DA Live'],
      ['DM parameters',   'Dynamic Media named presets set in CF property panel', 'AEM CF panel → UE'],
      ['MSM',             'AEM Multi-Site Manager — Blueprint rollout to live copies', 'AEM Author → Rollout wizard'],
      ['Workflows',       'AEM review/approve/publish pipeline per content item', 'AEM Author inbox'],
      ['AI / Generate',   'Content Advisor signals + Generate Variations copy',   'Experience Workspace'],
    ];
    return h('footer', { className: 'footer' },
      h('div', { className: 'footer-inner' },
        h('p', { className: 'footer-title' }, 'Technology Layer Reference'),
        h('table', { className: 'footer-table' },
          h('thead', null, h('tr', null, ['Capability','Technology + Data Flow','Edit Path'].map(function (c) { return h('th', { key: c }, c); }))),
          h('tbody', null, rows.map(function (r) { return h('tr', { key: r[0] }, r.map(function (c, i) { return h('td', { key: i }, c); })); })),
        ),
        h('p', { className: 'footer-copy' }, 'Luma is an Adobe demo brand · Demo powered by Adobe AEM Edge Delivery Services + AEM Cloud Service + Dynamic Media + Universal Editor'),
      ),
    );
  }

  /* ── App ── */
  function App() {
    var _slot = useState(getCurrentSlot); var slot = _slot[0];
    useEffect(function () {
      var id = setInterval(function () {
        /* slot state lives in RotatingHero; this keeps Nav in sync */
      }, 60000);
      return function () { clearInterval(id); };
    }, []);
    return h('div', null,
      h(Nav, { slot: getCurrentSlot() }),
      h(ArchDiagram),
      h(RotatingHero),
      h(ContentGrid),
      h(DmVisualizer),
      h(AiAdvisorPanel),
      h(Footer),
    );
  }

  ReactDOM.createRoot(document.getElementById('app')).render(h(App));
})();
</script>
</body>
</html>
